<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenCraft IDE</title>
<meta name="description" content="OpenCraft IDE: WordCraft, GridCraft, DeckCraft and PdfCraft as panels in one local workspace.">
<meta name="robots" content="noindex">
<!-- The IDE lives in ide/ (its paths, service worker and manifest are built around that folder).
     This entry page sends the root of the server there. -->
<meta http-equiv="refresh" content="0; url=ide/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; --bg: #FFFFFF; --ink: #0D0D12; --muted: #5B5F6B; --line: rgba(13, 13, 18, .14); }
  @media (prefers-color-scheme: dark) { :root { --bg: #121214; --ink: #F4F5F7; --muted: #9AA0AE; --line: rgba(244, 245, 247, .18); } }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 400 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 16px; box-sizing: border-box; }
  a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<p>Opening the <a href="ide/">OpenCraft IDE</a>&hellip;</p>
</body>
</html>
