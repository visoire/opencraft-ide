<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="format-detection" content="telephone=no">
  <title>OpenCraft IDE</title>
  <meta name="description" content="Local web IDE: WordCraft, GridCraft, DeckCraft and PdfCraft as panels in one window, with code editor, terminal, version control and AI over MCP.">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OpenCraft">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; frame-src 'self'; worker-src 'self' blob:; connect-src 'self' http: https: ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="manifest" href="/ide.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/src/styles/tokens.css">
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/workspace.css">
  <link rel="stylesheet" href="/src/styles/tools.css">
  <script type="module" src="/src/app/main.ts"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar" id="topbar"></header>
    <nav class="activity" id="activity" aria-label="Tools"></nav>
    <div class="ws" id="ws">
      <aside class="zone zone-left" id="zone-left" aria-label="Project tree"></aside>
      <div class="side-gutter" id="gutter-left" role="separator" aria-orientation="vertical" title="Drag to resize, double click resets"></div>
      <main class="stage" id="stage" aria-label="Panels"></main>
      <div class="side-gutter" id="gutter-right" role="separator" aria-orientation="vertical" title="Drag to resize, double click resets"></div>
      <aside class="zone zone-right" id="zone-right" aria-label="AI chat"></aside>
    </div>
    <div class="dock" id="dock" role="toolbar" aria-label="Minimized panels" hidden></div>
    <footer class="statusbar mono" id="statusbar"></footer>
  </div>
  <noscript>OpenCraft needs JavaScript.</noscript>
</body>
</html>
